<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国教材电子课本</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#1a1a2e;height:100vh;display:flex;flex-direction:column;overflow:hidden;color:#e0e0e0}

/* 顶部导航栏 */
.top-bar{height:48px;background:#16213e;display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid #0f3460;flex-shrink:0}
.top-bar .logo{font-size:18px;font-weight:600;color:#e94560;white-space:nowrap}
.top-bar .logo span{color:#fff;font-weight:400;font-size:13px;margin-left:6px}
.search-global{flex:1;max-width:400px;position:relative}
.search-global input{width:100%;padding:6px 12px 6px 32px;border:1px solid #0f3460;border-radius:6px;background:#0f3460;color:#fff;font-size:13px;outline:none}
.search-global input::placeholder{color:#7a7a9a}
.search-global i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#7a7a9a;font-size:12px}
.top-bar .user-area{display:flex;align-items:center;gap:8px;margin-left:auto}
.top-bar .user-area .avatar{width:28px;height:28px;border-radius:50%;background:#e94560;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff}

/* 主体 */
.main{display:flex;flex:1;overflow:hidden}

/* 左侧目录面板 */
.sidebar{width:280px;min-width:200px;background:#16213e;display:flex;flex-direction:column;border-right:1px solid #0f3460;flex-shrink:0}
.sidebar-header{padding:10px 14px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #0f3460}
.sidebar-header h3{font-size:13px;font-weight:500;color:#a0a0c0}
.sidebar-header .count{font-size:11px;color:#7a7a9a;background:#0f3460;padding:2px 8px;border-radius:10px}
.search-box{padding:8px 12px}
.search-box input{width:100%;padding:7px 10px 7px 30px;border:1px solid #0f3460;border-radius:6px;background:#0f3460;color:#fff;font-size:12px;outline:none}
.search-box input:focus{border-color:#e94560}
.search-box{position:relative}
.search-box i{position:absolute;left:22px;top:50%;transform:translateY(-50%);color:#7a7a9a;font-size:11px}
.tree-wrap{flex:1;overflow-y:auto;padding:4px 0}
.tree-wrap::-webkit-scrollbar{width:4px}
.tree-wrap::-webkit-scrollbar-thumb{background:#0f3460;border-radius:2px}

/* 树节点 */
.t-node{}
.t-label{padding:5px 10px 5px 0;cursor:pointer;display:flex;align-items:center;font-size:12px;transition:background .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-label:hover{background:#0f3460}
.t-label.active{background:#e94560;color:#fff}
.t-arrow{width:18px;text-align:center;font-size:9px;color:#5a5a8a;flex-shrink:0;transition:transform .15s}
.t-arrow.open{transform:rotate(90deg)}
.t-icon{margin-right:5px;font-size:12px;flex-shrink:0}
.t-name{flex:1;overflow:hidden;text-overflow:ellipsis}
.t-size{font-size:10px;color:#5a5a8a;margin-left:4px;flex-shrink:0}
.t-children{display:none}
.t-children.open{display:block}

/* 拖拽分隔条 */
.splitter-v{width:5px;background:#0f3460;cursor:col-resize;flex-shrink:0;transition:background .2s}
.splitter-v:hover,.splitter-v.active{background:#e94560}

/* 中间缩略图面板 */
.thumb-panel{width:160px;min-width:100px;background:#1a1a2e;display:flex;flex-direction:column;border-right:1px solid #0f3460;overflow:hidden;flex-shrink:0}
.thumb-header{padding:8px 10px;font-size:11px;color:#7a7a9a;border-bottom:1px solid #0f3460;display:flex;align-items:center;gap:6px}
.thumb-list{flex:1;overflow-y:auto;padding:8px}
.thumb-list::-webkit-scrollbar{width:3px}
.thumb-list::-webkit-scrollbar-thumb{background:#0f3460;border-radius:2px}
.thumb-item{cursor:pointer;margin-bottom:8px;border:2px solid transparent;border-radius:4px;overflow:hidden;transition:border-color .15s}
.thumb-item:hover{border-color:#0f3460}
.thumb-item.active{border-color:#e94560}
.thumb-item .page-img{width:100%;background:#2a2a4e;display:flex;align-items:center;justify-content:center;aspect-ratio:3/4;font-size:10px;color:#5a5a8a}
.thumb-item .page-num{text-align:center;font-size:10px;color:#7a7a9a;padding:2px 0}

/* 右侧预览区 */
.preview-area{flex:1;display:flex;flex-direction:column;overflow:hidden;background:#2a2a3e}
.preview-toolbar{height:40px;background:#16213e;display:flex;align-items:center;padding:0 12px;gap:2px;border-bottom:1px solid #0f3460;flex-shrink:0}
.preview-toolbar .tool-group{display:flex;align-items:center;gap:2px;padding:0 6px;border-right:1px solid #0f3460}
.preview-toolbar .tool-group:last-child{border-right:none}
.tbtn{width:32px;height:32px;border:none;border-radius:4px;background:transparent;color:#a0a0c0;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:14px;transition:all .15s}
.tbtn:hover{background:#0f3460;color:#fff}
.tbtn.active{background:#e94560;color:#fff}
.tbtn[disabled]{opacity:.3;cursor:not-allowed}
.tool-sep{width:1px;height:20px;background:#0f3460;margin:0 4px}
.zoom-info{font-size:11px;color:#7a7a9a;min-width:50px;text-align:center}
.page-info{font-size:11px;color:#a0a0c0;margin-left:auto;display:flex;align-items:center;gap:4px}
.page-info input{width:36px;padding:2px 4px;border:1px solid #0f3460;border-radius:3px;background:#0f3460;color:#fff;font-size:11px;text-align:center;outline:none}

/* PDF预览容器 */
.preview-body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:20px;background:#1e1e32}
.preview-body::-webkit-scrollbar{width:6px;height:6px}
.preview-body::-webkit-scrollbar-thumb{background:#0f3460;border-radius:3px}
.preview-body iframe{width:100%;height:100%;border:none;background:#fff;border-radius:4px;box-shadow:0 4px 20px rgba(0,0,0,.3)}

/* 空状态 */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#5a5a8a}
.empty-state i{font-size:64px;margin-bottom:16px;opacity:.3}
.empty-state p{font-size:14px}
.empty-state .hint{font-size:12px;margin-top:8px;opacity:.6}

/* 底部状态栏 */
.status-bar{height:28px;background:#16213e;display:flex;align-items:center;padding:0 12px;font-size:11px;color:#5a5a8a;border-top:1px solid #0f3460;flex-shrink:0;gap:16px}

/* Token弹窗 */
.modal-bg{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-bg.show{display:flex}
.modal-box{background:#16213e;border:1px solid #0f3460;border-radius:12px;padding:24px;width:380px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.modal-box h3{font-size:16px;margin-bottom:12px;color:#e94560}
.modal-box p{font-size:13px;color:#a0a0c0;margin-bottom:16px}
.modal-box input{width:100%;padding:10px;border:1px solid #0f3460;border-radius:6px;background:#0f3460;color:#fff;font-size:13px;outline:none;margin-bottom:12px}
.modal-box input:focus{border-color:#e94560}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.mbtn{padding:8px 16px;border:none;border-radius:6px;cursor:pointer;font-size:13px}
.mbtn-ok{background:#e94560;color:#fff}
.mbtn-cancel{background:#0f3460;color:#a0a0c0}

/* Toast */
.toast{position:fixed;bottom:40px;right:20px;background:#e94560;color:#fff;padding:10px 18px;border-radius:8px;font-size:13px;display:none;z-index:2000;box-shadow:0 4px 12px rgba(233,69,96,.4)}
.toast.show{display:block}

@media(max-width:900px){
  .thumb-panel{display:none}
  .sidebar{width:220px}
}
@media(max-width:600px){
  .sidebar{width:180px}
  .preview-toolbar .tool-group:nth-child(n+4){display:none}
}
</style>
</head>
<body>

<!-- 顶部导航 -->
<div class="top-bar">
  <div class="logo">📚 中国教材<span>1903册</span></div>
  <div class="search-global">
    <i class="fas fa-search"></i>
    <input type="text" id="globalSearch" placeholder="搜索教材名称、学科、版本..." oninput="onSearch(this.value)">
  </div>
  <div class="user-area">
    <button class="tbtn" onclick="showTokenModal()" title="Token设置"><i class="fas fa-key"></i></button>
    <div class="avatar">U</div>
  </div>
</div>

<!-- 主体 -->
<div class="main">
  <!-- 左侧目录 -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <h3><i class="fas fa-folder-tree"></i> 教材目录</h3>
      <span class="count">1903</span>
    </div>
    <div class="search-box">
      <i class="fas fa-search"></i>
      <input type="text" id="treeSearch" placeholder="筛选..." oninput="onSearch(this.value)">
    </div>
    <div class="tree-wrap" id="treeWrap"></div>
  </div>

  <div class="splitter-v" id="splitSidebar"></div>

  <!-- 中间缩略图 -->
  <div class="thumb-panel" id="thumbPanel">
    <div class="thumb-header"><i class="fas fa-th-list"></i> 页面缩略图</div>
    <div class="thumb-list" id="thumbList">
      <div class="empty-state" style="height:200px"><i class="fas fa-file-pdf" style="font-size:32px"></i><p style="font-size:11px">选择教材后显示</p></div>
    </div>
  </div>

  <div class="splitter-v" id="splitThumb"></div>

  <!-- 右侧预览 -->
  <div class="preview-area">
    <div class="preview-toolbar">
      <div class="tool-group">
        <button class="tbtn" onclick="doAnnotate()" title="标注"><i class="fas fa-highlighter"></i></button>
        <button class="tbtn" onclick="doPen()" title="画笔"><i class="fas fa-pen"></i></button>
        <button class="tbtn" onclick="doText()" title="文字"><i class="fas fa-font"></i></button>
        <button class="tbtn" onclick="doEraser()" title="橡皮擦"><i class="fas fa-eraser"></i></button>
      </div>
      <div class="tool-group">
        <button class="tbtn" onclick="doUndo()" title="撤销"><i class="fas fa-undo"></i></button>
        <button class="tbtn" onclick="doRedo()" title="重做"><i class="fas fa-redo"></i></button>
      </div>
      <div class="tool-sep"></div>
      <div class="tool-group">
        <button class="tbtn" onclick="zoomOut()" title="缩小"><i class="fas fa-search-minus"></i></button>
        <span class="zoom-info" id="zoomInfo">100%</span>
        <button class="tbtn" onclick="zoomIn()" title="放大"><i class="fas fa-search-plus"></i></button>
        <button class="tbtn" onclick="zoomFit()" title="适应宽度"><i class="fas fa-expand"></i></button>
      </div>
      <div class="tool-sep"></div>
      <div class="tool-group">
        <button class="tbtn" onclick="doSearch()" title="检索" id="btnSearch"><i class="fas fa-search"></i></button>
        <button class="tbtn" onclick="doEdit()" title="编辑" id="btnEdit"><i class="fas fa-edit"></i></button>
        <button class="tbtn" onclick="doSaveAs()" title="另存" id="btnSaveAs"><i class="fas fa-save"></i></button>
      </div>
      <div class="tool-group">
        <button class="tbtn" onclick="doDownload()" title="下载"><i class="fas fa-download"></i></button>
        <button class="tbtn" onclick="doShare()" title="分享" id="btnShare"><i class="fas fa-share-alt"></i></button>
        <button class="tbtn" onclick="doPrint()" title="打印"><i class="fas fa-print"></i></button>
      </div>
      <div class="page-info">
        <span id="pageLabel">-</span>
        <input type="number" id="pageInput" min="1" value="1" onkeydown="if(event.key==='Enter')goToPage(this.value)">
        <span>/ <span id="pageTotal">-</span></span>
      </div>
    </div>
    <div class="preview-body" id="previewBody">
      <div class="empty-state" id="emptyState">
        <i class="fas fa-book-open"></i>
        <p>请从左侧选择教材</p>
        <span class="hint">单击文件名即可预览PDF</span>
      </div>
      <canvas id="pdfCanvas" style="display:none;max-width:100%;height:auto;box-shadow:0 4px 20px rgba(0,0,0,.3)"></canvas>
    </div>
  </div>
</div>

<!-- 底部状态栏 -->
<div class="status-bar">
  <span id="statusFile">未选择文件</span>
  <span id="statusSize"></span>
  <span id="statusZoom"></span>
  <span style="margin-left:auto" id="statusToken">免费用户</span>
</div>

<!-- Token弹窗 -->
<div class="modal-bg" id="tokenModal">
  <div class="modal-box">
    <h3><i class="fas fa-key"></i> 会员Token</h3>
    <p id="tokenDesc">此功能需要会员权限，请输入Token</p>
    <input type="text" id="tokenInput" placeholder="输入Token (PRE_高级/BASIC_基础)" onkeydown="if(event.key==='Enter')submitToken()">
    <div class="modal-btns">
      <button class="mbtn mbtn-cancel" onclick="closeModal()">取消</button>
      <button class="mbtn mbtn-ok" onclick="submitToken()">确认</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

D%A6%E6%B9%96%E5%8C%97%E4%B8%AD%E8%80%83.pdf"}, {"id": "初中数学湖北中考答案_pdf", "text": "初中数学湖北中考答案.pdf", "size": "4.1MB", "url": "https://raw.githubusercontent.com/13888285815/ChinaTextbook/master/%E5%AD%A6%E6%95%B0%E5%AD%A6%E6%9C%80%E9%87%8D%E8%A6%81%E7%9A%84%E5%88%B7%E4%B9%A0%E9%A2%98%E5%9C%A8%E8%BF%99%E9%87%8C/%E5%88%9D%E4%B8%AD%E7%BB%83%E4%B9%A0%E9%A2%98_%E5%B8%A6%E7%AD%94%E6%A1%88/%E5%88%9D%E4%B8%AD%E6%95%B0%E5%AD%A6%E6%B9%96%E5%8C%97%E4%B8%AD%E8%80%83%E6%95%B0%E5%AD%A6%E7%9C%9F%E9%A2%98/%E5%88%9D%E4%B8%AD%E6%95%B0%E5%AD%A6%E6%B9%96%E5%8C%97%E4%B8%AD%E8%80%83%E7%AD%94%E6%A1%88.pdf"}, {"id": "初中数学重庆市中考数学试卷_答案_pdf", "text": "初中数学重庆市中考数学试卷-答案.pdf", "size": "2.3MB", "url": "https://raw.githubusercontent.com/13888285815/ChinaTextbook/master/%E5%AD%A6%E6%95%B0%E5%AD%A6%E6%9C%80%E9%87%8D%E8%A6%81%E7%9A%84%E5%88%B7%E4%B9%A0%E9%A2%98%E5%9C%A8%E8%BF%99%E9%87%8C/%E5%88%9D%E4%B8%AD%E7%BB%83%E4%B9%A0%E9%A2%98_%E5%B8%A6%E7%AD%94%E6%A1%88/%E5%88%9D%E4%B8%AD%E6%95%B0%E5%AD%A6%E9%87%8D%E5%BA%86%E5%B8%82%E4%B8%AD%E8%80%83%E6%95%B0%E5%AD%A6%E8%AF%95%E5%8D%B7/%E5%88%9D%E4%B8%AD%E6%95%B0%E5%AD%A6%E9%87%8D%E5%BA%86%E5%B8%82%E4%B8%AD%E8%80%83%E6%95%B0%E5%AD%A6%E8%AF%95%E5%8D%B7-%E7%AD%94%E6%A1%88.pdf"}, {"id": "初中数学重庆市中考数学试卷_pdf", "text": "初中数学重庆市中考数学试卷.pdf", "size": "853KB", "url": "https://raw.githubusercontent.com/13888285815/ChinaTextbook/master/%E5%AD%A6%E6%95%B0%E5%AD%A6%E6%9C%80%E9%87%8D%E8%A6%81%E7%9A%84%E5%88%B7%E4%B9%A0%E9%A2%98%E5%9C%A8%E8%BF%99%E9%87%8C/%E5%88%9D%E4%B8%AD%E7%BB%83%E4%B9%A0%E9%A2%98_%E5%B8%A6%E7%AD%94%E6%A1%88/%E5%88%9D%E4%B8%AD%E6%95%B0%E5%AD%A6%E9%87%8D%E5%BA%86%E5%B8%82%E4%B8%AD%E8%80%83%E6%95%B0%E5%AD%A6%E8%AF%95%E5%8D%B7/%E5%88%9D%E4%B8%AD%E6%95%B0%E5%AD%A6%E9%87%8D%E5%BA%86%E5%B8%82%E4%B8%AD%E8%80%83%E6%95%B0%E5%AD%A6%E8%AF%95%E5%8D%B7.pdf"}]}]}]}]}];

// ---- 权限 ----
const PERM={free:['download','print'],basic:['download','print','search','share'],premium:['download','print','search','edit','save','share']};
let token=localStorage.getItem('userToken')||null;
let curUrl='',curName='',curSize='';
function perm(a){if(!token)return PERM.free.includes(a);if(token.startsWith('PRE'))return PERM.premium.includes(a);if(token.startsWith('BASIC'))return PERM.basic.includes(a);return PERM.free.includes(a)}
function needPerm(a,n){if(perm(a))return true;document.getElementById('tokenDesc').textContent='"'+n+'"需要会员权限，请输入Token';document.getElementById('tokenModal').classList.add('show');document.getElementById('tokenInput').focus();window._pa=a;return false}
function showTokenModal(){document.getElementById('tokenDesc').textContent='请输入Token设置会员权限';document.getElementById('tokenModal').classList.add('show');document.getElementById('tokenInput').focus();window._pa=null}
function closeModal(){document.getElementById('tokenModal').classList.remove('show');document.getElementById('tokenInput').value=''}
function submitToken(){const v=document.getElementById('tokenInput').value.trim();if(!v){toast('请输入Token');return}token=v;localStorage.setItem('userToken',v);closeModal();updateStatus();toast('✅ Token已设置');if(window._pa){const a=window._pa;window._pa=null;setTimeout(()=>execAction(a),300)}}
function execAction(a){switch(a){case'search':doSearch();break;case'edit':doEdit();break;case'save':doSaveAs();break;case'download':doDownload();break;case'share':doShare();break;case'print':doPrint();break}}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500)}

// ---- 拖拽 ----
function initSplit(id,leftEl,rightEl){const s=document.getElementById(id);let drag=false;s.addEventListener('mousedown',e=>{drag=true;s.classList.add('active');document.body.style.cursor='col-resize';document.body.style.userSelect='none';e.preventDefault()});document.addEventListener('mousemove',e=>{if(!drag)return;const r=leftEl.parentElement.getBoundingClientRect();let w=e.clientX-r.left-leftEl.offsetLeft-5;w=Math.max(parseInt(getComputedStyle(leftEl).minWidth)||100,Math.min(w,parseInt(getComputedStyle(rightEl).minWidth)?r.width-parseInt(getComputedStyle(rightEl).minWidth):r.width*0.7));leftEl.style.width=w+'px'});document.addEventListener('mouseup',()=>{if(drag){drag=false;s.classList.remove('active');document.body.style.cursor='';document.body.style.userSelect=''}})}
initSplit('splitSidebar',document.getElementById('sidebar'),document.getElementById('thumbPanel'));

// ---- 树渲染 ----
function renderTree(nodes,container,depth=0){container.innerHTML='';nodes.forEach(n=>{const el=document.createElement('div');el.className='t-node';const lb=document.createElement('div');lb.className='t-label';lb.style.paddingLeft=(depth*16+8)+'px';if(n.children){const ar=document.createElement('span');ar.className='t-arrow';ar.textContent='▶';lb.appendChild(ar);const ic=document.createElement('span');ic.className='t-icon';ic.textContent=['📚','📖','📘','📋'][Math.min(depth,3)];lb.appendChild(ic);const nm=document.createElement('span');nm.className='t-name';nm.textContent=n.text;lb.appendChild(nm);lb.onclick=e=>{e.stopPropagation();const ch=el.querySelector('.t-children');const ar2=lb.querySelector('.t-arrow');ch.classList.toggle('open');ar2.classList.toggle('open')}}else{const ic=document.createElement('span');ic.className='t-icon';ic.textContent='📕';lb.appendChild(ic);const nm=document.createElement('span');nm.className='t-name';nm.textContent=n.text;lb.appendChild(nm);if(n.size){const sz=document.createElement('span');sz.className='t-size';sz.textContent=n.size;lb.appendChild(sz)}lb.onclick=()=>{openPdf(n);document.querySelectorAll('.t-label.active').forEach(x=>x.classList.remove('active'));lb.classList.add('active')}}el.appendChild(lb);if(n.children){const ch=document.createElement('div');ch.className='t-children';renderTree(n.children,ch,depth+1);el.appendChild(ch)}container.appendChild(el)})}

function onSearch(q){q=q.toLowerCase().trim();if(!q){renderTree(TREE_DATA,document.getElementById('treeWrap'));return}const f=filterT(TREE_DATA,q);renderTree(f,document.getElementById('treeWrap'));document.querySelectorAll('.t-children').forEach(x=>x.classList.add('open'));document.querySelectorAll('.t-arrow').forEach(x=>x.classList.add('open'))}
function filterT(nodes,q){return nodes.map(n=>{if(n.children){const c=filterT(n.children,q);if(c.length||n.text.toLowerCase().includes(q))return Object.assign({},n,{children:c});return null}return n.text.toLowerCase().includes(q)?n:null}).filter(x=>x)}

// ---- PDF预览 ----
let zoom=100;
function openPdf(node){curUrl=node.url;curName=node.text;curSize=node.size||'';document.getElementById('emptyState').style.display='none';const canvas=document.getElementById('pdfCanvas');canvas.style.display='block';console.log('打开PDF:',node.url);try{if(typeof pdfjsLib!=='undefined'){pdfjsLib.getDocument(node.url).promise.then(function(pdf){pdf.getPage(1).then(function(page){const viewport=page.getViewport({scale:1.5});canvas.height=viewport.height;canvas.width=viewport.width;page.render({canvasContext:canvas.getContext('2d'),viewport:viewport})})});genThumbs()}else{const fr=document.createElement('iframe');fr.style.width='100%';fr.style.height='100%';fr.style.border='none';fr.src='https://docs.google.com/gview?embedded=true&url='+encodeURIComponent(node.url);canvas.parentNode.replaceChild(fr,canvas)}}catch(e){console.error('加载失败:',e);toast('⚠️ 预览失败，请双击在新窗口打开')}document.getElementById('statusFile').textContent=node.text;document.getElementById('statusSize').textContent=node.size||''}

function genThumbs(){const list=document.getElementById('thumbList');list.innerHTML='';for(let i=1;i<=20;i++){const item=document.createElement('div');item.className='thumb-item'+(i===1?' active':'');item.innerHTML='<div class="page-img"><i class="fas fa-file-alt"></i></div><div class="page-num">'+i+'</div>';item.onclick=()=>{document.querySelectorAll('.thumb-item').forEach(x=>x.classList.remove('active'));item.classList.add('active')};list.appendChild(item)}}

// ---- 缩放 ----
function zoomIn(){zoom=Math.min(zoom+25,300);applyZoom()}
function zoomOut(){zoom=Math.max(zoom-25,25);applyZoom()}
function zoomFit(){zoom=100;applyZoom()}
function applyZoom(){document.getElementById('zoomInfo').textContent=zoom+'%';document.getElementById('statusZoom').textContent='缩放:'+zoom+'%'}

// ---- 工具 ----
function doAnnotate(){toast('📐 标注功能开发中')}
function doPen(){toast('🖊️ 画笔功能开发中')}
function doText(){toast('📝 文字功能开发中')}
function doEraser(){toast('🧹 橡皮擦功能开发中')}
function doUndo(){toast('↩️ 撤销功能开发中')}
function doRedo(){toast('↪️ 重做功能开发中')}
function doSearch(){if(!needPerm('search','PDF内搜索'))return;toast('🔍 检索功能开发中')}
function doEdit(){if(!needPerm('edit','PDF编辑'))return;toast('✏️ 编辑功能开发中')}
function doSaveAs(){if(!needPerm('save','云端另存'))return;toast('💾 另存功能开发中')}
function doDownload(){if(!perm('download')){needPerm('download','下载');return}if(!curUrl){toast('请先选择教材');return}const a=document.createElement('a');a.href=curUrl;a.download=curName;a.click();toast('⬇️ 开始下载')}
function doShare(){if(!needPerm('share','分享'))return;if(!curUrl){toast('请先选择教材');return}navigator.clipboard.writeText(curUrl).then(()=>toast('🔗 链接已复制')).catch(()=>toast('🔗 复制失败'))}
function doPrint(){if(!perm('print')){needPerm('print','打印');return}if(!curUrl){toast('请先选择教材');return}const fr=document.getElementById('pdfFrame');if(fr.contentWindow)fr.contentWindow.print();else toast('⚠️ 请下载后打印')}
function goToPage(p){toast('跳转至第'+p+'页')}

function updateStatus(){document.getElementById('statusToken').textContent=token?(token.startsWith('PRE')?'高级会员':token.startsWith('BASIC')?'基础会员':'免费用户'):'免费用户'}

// ---- 初始化 ----
renderTree(TREE_DATA,document.getElementById('treeWrap'));
updateStatus();
</script>
