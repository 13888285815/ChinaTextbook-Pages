<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>中国教材电子课本</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#1a1a2e;height:100vh;display:flex;flex-direction:column;overflow:hidden;color:#e0e0e0}
.top-bar{height:48px;background:#16213e;display:flex;align-items:center;padding:0 16px;gap:12px;border-bottom:1px solid #0f3460;flex-shrink:0}
.top-bar .logo{font-size:18px;font-weight:600;color:#e94560;white-space:nowrap}
.top-bar .logo span{color:#fff;font-weight:400;font-size:13px;margin-left:6px}
.search-global{flex:1;max-width:400px;position:relative}
.search-global input{width:100%;padding:6px 12px 6px 32px;border:1px solid #0f3460;border-radius:6px;background:#0f3460;color:#fff;font-size:13px;outline:none}
.search-global input::placeholder{color:#7a7a9a}
.search-global i{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:#7a7a9a;font-size:12px}
.main{display:flex;flex:1;overflow:hidden}
.sidebar{width:280px;min-width:200px;background:#16213e;display:flex;flex-direction:column;border-right:1px solid #0f3460;flex-shrink:0}
.tree-wrap{flex:1;overflow-y:auto;padding:4px 0}
.tree-wrap::-webkit-scrollbar{width:4px}
.tree-wrap::-webkit-scrollbar-thumb{background:#0f3460;border-radius:2px}
.t-label{padding:5px 10px 5px 0;cursor:pointer;display:flex;align-items:center;font-size:12px;transition:background .15s;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.t-label:hover{background:#0f3460}
.t-label.active{background:#e94560;color:#fff}
.t-arrow{width:18px;text-align:center;font-size:9px;color:#5a5a8a;flex-shrink:0;transition:transform .15s}
.t-arrow.open{transform:rotate(90deg)}
.t-icon{margin-right:5px;font-size:12px;flex-shrink:0}
.t-name{flex:1;overflow:hidden;text-overflow:ellipsis}
.t-size{font-size:10px;color:#5a5a8a;margin-left:4px;flex-shrink:0}
.t-children{display:none}
.t-children.open{display:block}
.thumb-panel{width:160px;min-width:100px;background:#1a1a2e;display:flex;flex-direction:column;border-right:1px solid #0f3460;overflow:hidden;flex-shrink:0}
.thumb-list{flex:1;overflow-y:auto;padding:8px}
.thumb-item{cursor:pointer;margin-bottom:8px;border:2px solid transparent;border-radius:4px;overflow:hidden;transition:border-color .15s}
.thumb-item:hover{border-color:#0f3460}
.thumb-item.active{border-color:#e94560}
.thumb-item canvas{width:100%;height:auto;display:block}
.thumb-item .page-num{text-align:center;font-size:10px;color:#7a7a9a;padding:2px 0}
.preview-body{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:20px;background:#1e1e32}
.preview-body canvas{background:#fff;box-shadow:0 4px 20px rgba(0,0,0,.3);max-width:100%;height:auto}
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;color:#5a5a8a}
.status-bar{height:28px;background:#16213e;display:flex;align-items:center;padding:0 12px;font-size:11px;color:#5a5a8a;border-top:1px solid #0f3460;flex-shrink:0;gap:16px}
.toast{position:fixed;bottom:40px;left:50%;transform:translateX(-50%);background:#e94560;color:#fff;padding:8px 16px;border-radius:6px;font-size:13px;z-index:9999;animation:fadeIn .3s}
@keyframes fadeIn{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
</style>
</head>
<body>
<div class="top-bar">
  <div class="logo">📚 中国教材电子课本 <span>共1903册</span></div>
  <div class="search-global"><i class="fas fa-search"></i><input type="text" id="searchInput" placeholder="搜索教材..." oninput="onSearch(this.value)"></div>
</div>
<div class="main">
  <div class="sidebar">
    <div class="tree-wrap" id="treeWrap"></div>
  </div>
  <div class="thumb-panel">
    <div class="thumb-list" id="thumbList"></div>
  </div>
  <div class="preview-body" id="previewBody">
    <div class="empty-state" id="emptyState"><i class="fas fa-file-pdf"></i><p>请从左侧选择教材</p><span class="hint">单击文件名即可预览PDF</span></div>
    <canvas id="pdfCanvas" style="display:none"></canvas>
  </div>
</div>
<div class="status-bar">
  <span id="statusFile">未选择文件</span>
  <span id="statusSize"></span>
  <span id="statusPage"></span>
  <span id="statusZoom"></span>
</div>
<script src="tree_data.js"></script>
<script>
// 全局变量
let pdfDoc = null, pageNum = 1, scale = 1.5;
let curUrl = '', curName = '', curSize = '';

// 初始化 PDF.js
if (typeof pdfjsLib !== 'undefined') {
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    console.log('✅ PDF.js 已加载');
} else {
    console.error('❌ PDF.js 加载失败');
}

// 打开 PDF
async function openPdf(node) {
    curUrl = node.url;
    curName = node.text;
    curSize = node.size || '';
    
    document.getElementById('emptyState').style.display = 'none';
    document.getElementById('pdfCanvas').style.display = 'block';
    document.getElementById('statusFile').textContent = node.text;
    document.getElementById('statusSize').textContent = node.size || '';
    
    try {
        console.log('正在加载 PDF:', node.url);
        const loadingTask = pdfjsLib.getDocument(curUrl);
        pdfDoc = await loadingTask.promise;
        pageNum = 1;
        await renderPage(pageNum);
        await genThumbs();
        console.log('✅ PDF 加载成功，共', pdfDoc.numPages, '页');
    } catch (e) {
        console.error('❌ PDF.js 加载失败:', e);
        toast('⚠️ PDF 加载失败，正在新窗口打开');
        window.open(curUrl, '_blank');
    }
}

// 渲染页面
async function renderPage(num) {
    if (!pdfDoc) return;
    const page = await pdfDoc.getPage(num);
    const canvas = document.getElementById('pdfCanvas');
    const context = canvas.getContext('2d');
    const viewport = page.getViewport({ scale: scale });
    canvas.height = viewport.height;
    canvas.width = viewport.width;
    await page.render({ canvasContext: context, viewport: viewport }).promise;
    document.getElementById('statusPage').textContent = num + ' / ' + pdfDoc.numPages;
    document.getElementById('statusZoom').textContent = '缩放:' + Math.round(scale * 100) + '%';
}

// 生成缩略图
async function genThumbs() {
    if (!pdfDoc) return;
    const list = document.getElementById('thumbList');
    list.innerHTML = '';
    const maxPages = Math.min(pdfDoc.numPages, 20);
    
    for (let i = 1; i <= maxPages; i++) {
        const item = document.createElement('div');
        item.className = 'thumb-item' + (i === pageNum ? ' active' : '');
        
        const canvas = document.createElement('canvas');
        canvas.className = 'page-img';
        
        const page = await pdfDoc.getPage(i);
        const viewport = page.getViewport({ scale: 0.3 });
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        await page.render({ canvasContext: canvas.getContext('2d'), viewport: viewport }).promise;
        
        item.appendChild(canvas);
        
        const numDiv = document.createElement('div');
        numDiv.className = 'page-num';
        numDiv.textContent = i;
        item.appendChild(numDiv);
        
        item.onclick = () => {
            document.querySelectorAll('.thumb-item').forEach(x => x.classList.remove('active'));
            item.classList.add('active');
            renderPage(i);
        };
        
        list.appendChild(item);
    }
}

// 缩放
function zoomIn() { scale = Math.min(scale + 0.25, 3); renderPage(pageNum); }
function zoomOut() { scale = Math.max(scale - 0.25, 0.25); renderPage(pageNum); }

// 下载
function doDownload() {
    const a = document.createElement('a');
    a.href = curUrl;
    a.download = curName;
    a.click();
    toast('⬇️ 开始下载');
}

// 分享
function doShare() {
    navigator.clipboard.writeText(curUrl).then(() => {
        toast('🔗 链接已复制');
    }).catch(() => {
        toast('⚠️ 复制失败');
    });
}

// 打印
function doPrint() {
    window.print();
}

// 搜索
function onSearch(q) {
    q = q.toLowerCase().trim();
    if (!q) {
        renderTree(TREE_DATA, document.getElementById('treeWrap'));
        return;
    }
    const f = filterT(TREE_DATA, q);
    renderTree(f, document.getElementById('treeWrap'));
    document.querySelectorAll('.t-children').forEach(x => x.classList.add('open'));
    document.querySelectorAll('.t-arrow').forEach(x => x.classList.add('open'));
}

function filterT(nodes, q) {
    return nodes.map(n => {
        if (n.children) {
            const c = filterT(n.children, q);
            if (c.length || n.text.toLowerCase().includes(q)) return Object.assign({}, n, { children: c });
            return null;
        }
        return n.text.toLowerCase().includes(q) ? n : null;
    }).filter(x => x);
}

// 树渲染
function renderTree(nodes, container, depth=0) {
    container.innerHTML = '';
    nodes.forEach(n => {
        const el = document.createElement('div');
        el.className = 't-node';
        const lb = document.createElement('div');
        lb.className = 't-label';
        lb.style.paddingLeft = (depth * 16 + 8) + 'px';
        
        if (n.children) {
            const ar = document.createElement('span');
            ar.className = 't-arrow';
            ar.textContent = '▶';
            lb.appendChild(ar);
            const ic = document.createElement('span');
            ic.className = 't-icon';
            ic.textContent = ['📚','📖','📘','📋'][Math.min(depth,3)];
            lb.appendChild(ic);
            const nm = document.createElement('span');
            nm.className = 't-name';
            nm.textContent = n.text;
            lb.appendChild(nm);
            lb.onclick = (e) => {
                e.stopPropagation();
                const ch = el.querySelector('.t-children');
                const ar2 = lb.querySelector('.t-arrow');
                ch.classList.toggle('open');
                ar2.classList.toggle('open');
            };
        } else {
            const ic = document.createElement('span');
            ic.className = 't-icon';
            ic.textContent = '📕';
            lb.appendChild(ic);
            const nm = document.createElement('span');
            nm.className = 't-name';
            nm.textContent = n.text;
            lb.appendChild(nm);
            if (n.size) {
                const sz = document.createElement('span');
                sz.className = 't-size';
                sz.textContent = n.size;
                lb.appendChild(sz);
            }
            lb.onclick = () => {
                openPdf(n);
                document.querySelectorAll('.t-label.active').forEach(x => x.classList.remove('active'));
                lb.classList.add('active');
            };
            lb.ondblclick = () => { if (n.url) window.open(n.url, '_blank'); };
        }
        
        el.appendChild(lb);
        if (n.children) {
            const ch = document.createElement('div');
            ch.className = 't-children';
            renderTree(n.children, ch, depth + 1);
            el.appendChild(ch);
        }
        container.appendChild(el);
    });
}

// Toast 提示
function toast(msg) {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

// 初始化
document.addEventListener('DOMContentLoaded', () => {
    renderTree(TREE_DATA, document.getElementById('treeWrap'));
    console.log('✅ 树形目录已渲染');
});
</script>
</body>
</html>
